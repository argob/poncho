<script id="code_map">
const _ENV = "develop";
const conf = {
    production: {
        imagePath: "/sites/default/files/",
        thumbnailPath: "/sites/default/files/",
        iconPath: "/sites/default/files/",
        spreadsheetKey :"1k8FWqXHiOoKtnWA2QZSWgaIBOghlImhMKaLiz8xoh7E",
        sheetName: "dataset",
        mapView: { lat: -25.68148542057519, lng: -54.44990515708924 },
        mapZoom: 17
    },
    develop : {
        imagePath: "./data/template-15/images/",
        thumbnailPath: "./data/template-15/images/",
        iconPath: "./data/template-15/images/",
        spreadsheetKey :"1k8FWqXHiOoKtnWA2QZSWgaIBOghlImhMKaLiz8xoh7E",
        sheetName: "dataset",
        mapView: { lat: -25.68148542057519, lng: -54.44990515708924 },
        mapZoom: 16
    }
};

const { 
    imagePath, 
    thumbnailPath, 
    iconPath, 
    spreadsheetKey, 
    sheetName, mapView, mapZoom} = conf[ _ENV ];

var pm;

/**
 * Crea un divIcon personalizado para un marcador de mapa.
 * Utiliza L.divIcon de Leaflet.js.
 * @param {string} urlImagen URL de la imagen del marcador.
 * @param {string} textoAlternativo Texto para accesibilidad (sr-only).
 * @returns {L.divIcon | undefined} Un objeto divIcon de Leaflet o undefined 
 * si faltan parámetros.
 */
function _divMarker(urlImagen, textoAlternativo, statusKey) {
    // Comprueba que ambos parámetros sean strings no vacíos
    if ([urlImagen, textoAlternativo].every(param => typeof param === "string" && param.trim() !== "")) {
        const imgElement = new Image();
        imgElement.src = urlImagen;
        imgElement.loading = "lazy";
        imgElement.alt = "";
        imgElement.setAttribute("width", 34);
        imgElement.setAttribute("height", 34);

        // const srOnlySpan = document.createElement("span");
        // srOnlySpan.className = "sr-only";
        // srOnlySpan.textContent =  `${textoAlternativo}`;

        const iconSpan = document.createElement("span");
        iconSpan.className = "poncho-map__icon";
        //iconSpan.appendChild(srOnlySpan);
        iconSpan.appendChild(imgElement);

        const containerDiv = document.createElement("div");
        containerDiv.className = "poncho-map__icon-container";
        containerDiv.appendChild(iconSpan);
  

        const icon = new L.divIcon({
            html: containerDiv.outerHTML,
            iconAnchor: [20, 40],
            iconSize: [40, 40],
            popupAnchor: [-3, -40]
        });

        return icon;
    }
}


// Loader
const loader = new PonchoMapLoader({scope: "poncho-map", cover_opacity: .3});
loader.load();

 // init
(async() => {

    const gapi = new GapiSheetData();
    // fetch data
    const googlesheet_data = await fetch_json( gapi.url(sheetName, spreadsheetKey)); 
    const gapiData = gapi.json_data(googlesheet_data);

    // map options
    const options = {
        summary: {
            title: "Mapa del estado de las obras viales",
            hidden: true
        },
        map_zoom: mapZoom,
        map_view: Object.values(mapView),
        scope: "poncho-map",
        id: "id",
        title: "nom-sitio",
        tooltip: true,
        template_markdown: true,
        theme_map: "dark",
        allowed_tags: ["*"],
        template_innerhtml:true,
        template_structure: {
            lead: {
                key: "tipo", 
                css: "text-arg-gris-intermedio border-bottom small fw-semibold m-t-0",
                //style: "color: orange; font-size:2em;"
            },
            values: [
                "image-custom", "descripcion-custom", "url-custom"
            ],
            mixing: [
                {
                    template: `{% '<img src="${imagePath}{{image}}" alt="image-alt" />' `
                    + `if image != "" else "" %}`,
                    key: "image-custom",
                    hide_header: true,
                    header: "imagen"
                },
                {
                    template: `{{descripcion}}`,
                    key: "descripcion-custom",
                    header: "Descripción",
                    hide_header: true
                },
                {
                    template: `{% '<a class="btn btn-primary" href="{{url}}">Ir al sitio</a>' if url != "" else "" %}`,
                    key: "url-custom",
                    header: "Sitio web",
                    hide_header: true
                }
            ]
        },
        headers: gapiData.headers,
        slider: true,
        map_layers_default: "satelital",
        hash: true,
        fit_bounds_after_filter: true,
                    tooltip_options:{
                className: "leaflet-tooltip-own",
                direction: "auto",
                offset: [25, -18],
                opacity: 1,
                permanent: false,
                sticky: false
            },
        tooltip_label: `<figure class="tooltip-figure">`
            + `{% '<div class="image"><img class="tooltip-figure__image" `
            + `width="150" src="${thumbnailPath}{{thumbnail}}?v=2" alt="{{thumbnail-alt}}" /></div>'`
            + ` if thumbnail != '' else '' %} <figurecaption `
            + `class="tooltip-figure__caption">{{nom-sitio}}` 
            + `</figurecaption></figure>`,
        marker(self, ele) {
            const availableIcons = [
                "alojamiento-turistico",
                "centro-de-visitantes",
                "prestador-turistico",
                "servicios-gastronomicos"
            ];
            const { thumbnail, "nom-sitio":nombre, tipo } = ele;
            const statusKey = true;
            const slugifiedTipo = slugify(tipo);
            if(!availableIcons.includes(slugifiedTipo)){
                return "azul";
            }
            return _divMarker(
                `${iconPath}${slugifiedTipo}.svg`, nombre, statusKey
            );
        },
        open_maps: true,
    };

    // render map
    pm = new PonchoMapFilter(gapiData.entries, options);
    
    // Buscador
    const searchOptions = {
        scope: "poncho-map-search", 
        combobox: true,
        text: "tramo",
        open_maps:true,
        placeholder: "Buscar por nombre",
        search_fields: [
            "nom-sitio", "tipo"
        ] 
    };
    const pmSearch = new PonchoMapSearch(pm, searchOptions);
    pm.render();
    pmSearch.render();
    loader.close();
})();
</script>
