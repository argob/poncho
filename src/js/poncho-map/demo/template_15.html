<script id="code_map">
const _ENV = "develop";
var pm;
const conf = {
    production: {
        imagePath: "./data/template-15/images/",
        thumbnailPath: "./data/template-15/images/",
        iconPath: "./data/template-15/images/",
        strokeColor: "var(--arg-cielo)",
        strokeActiveColor: "var(--arg-escarapela)",
        service: "https://sigvial.vialidad.gob.ar/geoserver/dnv/ows?" +
            "service=WFS" +
            "&version=1.0.0" +
            "&request=GetFeature" +
            "&typeName=dnv:Obras_Ejecución2026" +
            "&outputFormat=application/json",
    },
    develop : {
        imagePath: "./data/template-15/images/",
        thumbnailPath: "./data/template-15/images/",
        iconPath: "./data/template-15/images/",
        strokeColor: "var(--arg-maiz)",
        strokeActiveColor: "var(--arg-mandarina)",
        service: "./data/template-15/iguazu-infraestructura.geojson"
    }
};

const {strokeColor, strokeActiveColor, service, imagePath, thumbnailPath, iconPath} = conf[ _ENV ];


/**
 * Crea un divIcon personalizado para un marcador de mapa.
 * Utiliza L.divIcon de Leaflet.js.
 * @param {string} urlImagen URL de la imagen del marcador.
 * @param {string} textoAlternativo Texto para accesibilidad (sr-only).
 * @returns {L.divIcon | undefined} Un objeto divIcon de Leaflet o undefined 
 * si faltan parámetros.
 */
function _divMarker(urlImagen, textoAlternativo, statusKey) {
    // Comprueba que ambos parámetros sean strings no vacíos
    if ([urlImagen, textoAlternativo].every(param => typeof param === "string" && param.trim() !== "")) {
        const imgElement = new Image();
        imgElement.src = urlImagen;
        imgElement.loading = "lazy";
        imgElement.alt = "";
        imgElement.setAttribute("width", 34);
        imgElement.setAttribute("height", 34);

        // const srOnlySpan = document.createElement("span");
        // srOnlySpan.className = "sr-only";
        // srOnlySpan.textContent =  `${textoAlternativo}`;

        const iconSpan = document.createElement("span");
        iconSpan.className = "poncho-map__icon";
        //iconSpan.appendChild(srOnlySpan);
        iconSpan.appendChild(imgElement);

        const containerDiv = document.createElement("div");
        containerDiv.className = "poncho-map__icon-container";
        containerDiv.appendChild(iconSpan);
  

        const icon = new L.divIcon({
            html: containerDiv.outerHTML,
            iconAnchor: [20, 40],
            iconSize: [40, 40],
            popupAnchor: [-3, -40]
        });

        return icon;
    }
}



    headStyle(
        "parques-nacionales-style", 
        `.definition-list dd img {border-radius:4px;}.poncho-map .leaflet-tooltip-own{--pm-tooltip:var(--arg-gris-niebla, white);--pm-tooltip-color:var(--arg-gray-dark);padding:6px;font-size:.8rem}.tooltip-figure,.tooltip-figure figcaption{padding:0;margin:0;border:none}.tooltip-figure .tooltip-figure__caption{display:block;max-width:120px;line-height:1.35;color:var(--arg-gray-dark);margin-bottom:2px;overflow-wrap:break-word!important;white-space:normal}.tooltip-figure .tooltip-figure__image{aspect-ratio:16/10;width:120px;background:no-repeat 0 0 / cover gray;margin-bottom:6px;border-radius:2px}`
    );


// Modifica el color del active
headStyle(
    "vialidad", 
    `.poncho-map path.marker--active {stroke:${strokeActiveColor};`
    + `filter: none !important;opacity:1 !important;}`
);

// Loader
const loader = new PonchoMapLoader({ scope: "poncho-map", cover_opacity: .3 });
loader.load();

 // init
(async() => {
    const gdata = await fetch_json( service ); 

    // Propiedades de polígono
    gdata.features = gdata.features.filter(entry => {
        return ( ["41", "16","108", "20"].includes( String( entry.properties["ID"] ) )  )
        // return ( ["41", "16","108", "20"].includes( String( entry.properties["ID"] ) ) || entry.geometry.type !== "Point" )
    }); 

    gdata.features.forEach((entry, i) => {
        entry.properties.color = strokeColor;
        entry.properties["stroke-color"] = strokeColor;
        entry.properties["stroke-opacity"] = 1;
        entry.properties["stroke-width"] = 3;
        entry.properties["TIPO"] = entry.properties["TIPO"] === null ? "Sin especificar" : entry.properties["TIPO"]
    });

    // Set headers
    const headers = {
        areas: "Áreas",
        tramo: "Tramo",
        seccion: "Sección",
        user_tramo: "Tramo",
        user_seccion: "Sección",
        km: "Km",
        estado: "Estado",
        obra: "Obra",
        ruta: "Ruta",
        distrito: "Provincia",
        id_registro: "Número de registro",
        id_sigo: "Identificador SIGO",
        cod_ruta: "Código de ruta",
        id_tipo_obra: "id_tipo_obra",
        pkf: "Punto kilométrico final",
        pki: "Punto kilométrico inicial",
        tipo_obra: "Tipo de obra",
    };

    // map options
    const options = {
        summary: {
            title: "Mapa del estado de las obras viales",
            hidden: true
        },
        scope: "poncho-map",
        id: "id",
        title: "NOM_SITIO",
        tooltip: true,
        template_markdown: false,
        theme_map: "dark",
        allowed_tags: ["*"],
        template_innerhtml:true,
        template: (self, entry) => {
            if (!entry.IMAGE.includes('<img')) {
                entry.IMAGE = `<img src="${imagePath}${entry.IMAGE}" />`;
            }
            return self.defaultTemplate(self, entry);
        },
        _template_structure: {

            _values: [
                "distrito",
                "areas",
                "tipo_obra",
                "ruta",
                "tramo",
                "seccion",
                "km",
                "estado",
                "pki",
                "pkf",
                "id_registro",
                "id_sigo",
                "cod_ruta",
            ]
        },
        _headers: headers,
        slider: true,
        hash: true,
        fit_bounds_after_filter: true,
                    tooltip_options:{
                className: "leaflet-tooltip-own",
                direction: "auto",
                offset: [16, -18],
                opacity: 1,
                permanent: false,
                sticky: false
            },
        tooltip_label: `{% '<div class="m-b-05"><img width="150" src="${thumbnailPath}{{THUMBNAIL}}?v=1" /></div>' if THUMBNAIL != '' else '' %} {{NOM_SITIO}}`,
        filters: [
            {
                //legend : "Filtrar por provincia",
                field: ["TIPO", "checked"],
                fields: false,
                type: "select",
                //show_label: false,
                //check_uncheck_all: false,
                //all_options_text: "Todas las provincias"
            }
        ],
        marker(self, ele) {
            const { THUMBNAIL:thumbnail, NOM_SITIO:nombre, TIPO } = ele;
            const statusKey = true;
            const tipo = slugify(TIPO);
            return _divMarker(`${iconPath}${tipo}.svg`, nombre, statusKey);
        },
        open_maps: true,
    };

    // render map
    pm = new PonchoMapFilter(gdata, options);
    
    // Buscador
    const searchOptions = {
        scope: "poncho-map-search", 
        combobox: true,
        text: "tramo",
        open_maps:true,
        placeholder: "Buscar por nombre de obra, ruta, id SIGO o provincia",
        search_fields: [
            "NOM_SITIO", 
        ] 
    };
    const pmSearch = new PonchoMapSearch(pm, searchOptions);
    pm.render();
    pmSearch.render();
    loader.close();
})();
</script>
