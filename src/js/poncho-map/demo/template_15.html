<script id="code_map">
const _ENV = "develop";
const conf = {
    production: {
        imagePath: "/sites/default/files/",
        thumbnailPath: "/sites/default/files/",
        iconPath: "/sites/default/files/",
        spreadsheetKey :"1k8FWqXHiOoKtnWA2QZSWgaIBOghlImhMKaLiz8xoh7E",
        sheetName: "dataset",
        geoDataSenderos: "/sites/default/files/iguazu-senderos.txt",
        geoDataInfraestructura: "/sites/default/files/iguazu-infraestructura.txt",
        mapView: { lat: -25.68148542057519, lng: -54.44990515708924 },
        mapZoom: 17
    },
    develop : {
        imagePath: "./data/template-15/images/",
        thumbnailPath: "./data/template-15/images/",
        iconPath: "./data/template-15/images/",
        spreadsheetKey :"1k8FWqXHiOoKtnWA2QZSWgaIBOghlImhMKaLiz8xoh7E",
        sheetName: "dataset",
        geoDataSenderos: "./data/template-15/iguazu-senderos.geojson",
        geoDataInfraestructura: "./data/template-15/iguazu-infraestructura.geojson",
        //mapView: { lat: -25.68148542057519, lng: -54.44990515708924 }, // zoom 17
        mapView: {lat: -25.68148542057519, lng: -54.4499158859253}, // zoom 16
        mapZoom: 16
    }
};

const { 
    imagePath, 
    thumbnailPath, 
    iconPath, 
    spreadsheetKey, 
    geoDataSenderos, geoDataInfraestructura,
    sheetName, mapView, mapZoom} = conf[ _ENV ];

var pm;


async function renderHome(){
    const gapi = new GapiSheetData();

    let data = new Map();
    return Promise.all([
            fetch_json( gapi.url(sheetName, spreadsheetKey)),
            fetch_json( geoDataSenderos ),
            fetch_json( geoDataInfraestructura )
    ]).then(function(responses){
        responses.forEach((result, index) => {
            try {
                if (!result) {
                    console.error(`Error: respuesta vacía en índice ${index}`);
                    return;
                }
                if(index === 0){
                    if (result && result.values) {
                        data.set("dataset", result);
                    }
                } else if(index === 1){
                    if (result && result.features) {
                        data.set("senderos", result.features);
                    }
                } else if(index === 2){
                    if (result && result.features) {
                        data.set("infraestructura", result.features);
                    }
                }

            } catch (error) {
                console.error(`Error al procesar respuesta ${index}:`, error);
            }

        });
        return data;
    }).catch(function(error){
        console.error('Error al cargar datos:', error);
        return data;
    });
}


/**
 * Crea un divIcon personalizado para un marcador de mapa.
 * Utiliza L.divIcon de Leaflet.js.
 * @param {string} urlImagen URL de la imagen del marcador.
 * @param {string} textoAlternativo Texto para accesibilidad (sr-only).
 * @returns {L.divIcon | undefined} Un objeto divIcon de Leaflet o undefined 
 * si faltan parámetros.
 */
function _divMarker(urlImagen, textoAlternativo, statusKey) {
    // Comprueba que ambos parámetros sean strings no vacíos
    if ([urlImagen, textoAlternativo].every(param => typeof param === "string" && param.trim() !== "")) {
        const imgElement = new Image();
        imgElement.src = urlImagen;
        imgElement.loading = "lazy";
        imgElement.alt = "";
        imgElement.setAttribute("width", 34);
        imgElement.setAttribute("height", 34);

        // const srOnlySpan = document.createElement("span");
        // srOnlySpan.className = "sr-only";
        // srOnlySpan.textContent =  `${textoAlternativo}`;

        const iconSpan = document.createElement("span");
        iconSpan.className = "poncho-map__icon";
        //iconSpan.appendChild(srOnlySpan);
        iconSpan.appendChild(imgElement);

        const containerDiv = document.createElement("div");
        containerDiv.className = "poncho-map__icon-container";
        containerDiv.appendChild(iconSpan);
  

        const icon = new L.divIcon({
            html: containerDiv.outerHTML,
            iconAnchor: [20, 40],
            iconSize: [40, 40],
            popupAnchor: [-3, -40]
        });

        return icon;
    }
}


// Loader
const loader = new PonchoMapLoader({scope: "poncho-map", cover_opacity: .3});
loader.load();

 // init
(async() => {
    const gapi = new GapiSheetData();
    const data = await renderHome();
    const geoJsonData = {
        type: "FeatureCollection",
        features: [...data.get('senderos'),...data.get('infraestructura')]
    };
    const gapiData = gapi.json_data( data.get('dataset') );

    const entries = new Map();
    for(let entry of gapiData.entries){
        const {
            id, 
            descripcion, 
            url, 
            image, 
            "image-alt":imageAlt, 
            thumbnail, 
            "thumbnail-alt":thumbnailAlt
        } = entry;
        entries.set(String(id), {
            descripcion, url, image, imageAlt, thumbnail, thumbnailAlt
        });
    }

    geoJsonData.features.forEach(e => {
        const {type} = e.geometry;
        const {ID, NOM_SEND="", NOM_SITIO=""} = e.properties;

        let name_custom;
        if( String(NOM_SEND).trim() !== "" ) {
            name_custom = NOM_SEND;
        } else if( String(NOM_SITIO).trim() !== "" ) {
            name_custom = NOM_SITIO;
        } else {
            name_custom = "Nombre no disponible";
        }
        e.properties = { ...e.properties, name_custom };

        if(entries.has(String(ID)) && type === "Point"){
            const {
                descripcion, 
                url, 
                image, 
                imageAlt, 
                thumbnail, 
                thumbnailAlt
            } = entries.get(String(ID));




            e.properties = {
                ...e.properties,
                descripcion,
                url: url,
                image: image,
                "image-alt": imageAlt,
                thumbnail: thumbnail,
                "thumbnail-alt": thumbnailAlt
            };
        }
    });


    // map options
    const options = {
        summary: {
            title: "Mapa del estado de las obras viales",
            hidden: true
        },
        map_zoom: mapZoom,
        map_view: Object.values(mapView),
        scope: "poncho-map",
        // id: "id",
        title: "name_custom",
        // name: "name_custom",
        tooltip: true,
        template_markdown: true,
        theme_map: "dark",
        allowed_tags: ["*"],
        template_innerhtml:true,
        _template:(self, entry)=>{
            
            let name;
            if( entry.hasOwnProperty("NOM_SEND") && entry.NOM_SEND.trim() !== "" ) {
                name = entry.NOM_SEND;
            } else if( entry.hasOwnProperty("NOM_SITIO") && entry.NOM_SITIO.trim() !== "" ) {
                name = entry.NOM_SITIO;
            } else {
                name = "Nombre no disponible";
            }
            entry["name_custom"] = name;

            return self.defaultTemplate(self, entry);
        },
        template_structure: {
            lead: {
                key: "tipo", 
                css: "text-arg-gris-intermedio border-bottom small fw-semibold m-t-0",
            },
            title:"name_custom",
            header_visibility: {
                "descripcion": "sr-only",
                "image-custom": "sr-only",
                "url-custom": "sr-only"
            },
            values: [
                "image-custom", "descripcion", "url-custom"
            ],
            mixing: [
                {
                    template: `{% '<img src="${imagePath}{{image}}" alt="{{image-alt}}" />' `
                    + `if image != "" else "" %}`,
                    key: "image-custom",
                    hide_header: true,
                },
                {
                    template: `{% '<a class="btn btn-primary" href="{{url}}">Ir al sitio</a>' if url != "" else "" %}`,
                    key: "url-custom",
                    header: "Sitio web",
                }
            ]
        },
        // headers: gapiData.headers,
        _filters: [
            {
                legend: "Filtrar por tipo",
                label: "Tipo de infraestructura",
                type: "select",
                field: ["TIPO", "checked"]
            }
        ],
        slider: true,
        map_layers_default: "satelital",
        hash: true,
        fit_bounds_after_filter: true,
        tooltip_options:{
                className: "leaflet-tooltip-own",
                direction: "auto",
                offset: [25, -18],
                opacity: 1,
                permanent: false,
                sticky: false
            },
        tooltip_label: `<figure class="tooltip-figure">`
            + `{% '<div class="image"><img class="tooltip-figure__image" `
            + `width="150" src="${thumbnailPath}{{thumbnail}}?v=2" alt="{{thumbnail-alt}}" /></div>'`
            + ` if thumbnail != '' else '' %} <figurecaption `
            + `class="tooltip-figure__caption">{{name_custom}}` 
            + `</figurecaption></figure>`,
        marker(self, ele) {
            const availableIcons = [
                "alojamiento-turistico",
                "centro-de-visitantes",
                "prestador-turistico",
                "servicios-gastronomicos"
            ];
            const { thumbnail=false, "name_custom":nombre, "TIPO":tipo } = ele;

            const statusKey = true;
            const slugifiedTipo = slugify(tipo);
            if(!availableIcons.includes(slugifiedTipo) || !thumbnail){
                return "azul";
            }
            return _divMarker(
                `${iconPath}${slugifiedTipo}.svg`, nombre, statusKey
            );
        },
        open_maps: true,
    };

    // render map
    pm = new PonchoMapFilter(geoJsonData, options);
    
    // Buscador
    const searchOptions = {
        scope: "poncho-map-search", 
        combobox: true,
        text: "tramo",
        open_maps:true,
        placeholder: "Buscar por nombre",
        search_fields: [
            "NOM_SITIO", "TIPO"
        ] 
    };
    const pmSearch = new PonchoMapSearch(pm, searchOptions);
    pm.render();
    pmSearch.render();
    loader.close();
})();
</script>
